<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>V.I.K.I. — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --navy-0:#020408;
  --navy-1:#040a14;
  --navy-2:#07121f;
  --blue-0:#eef4fb;   /* silver-white: primary text / voxel highlights */
  --blue-1:#4fa6ff;   /* electric blue: primary accent */
  --blue-2:#6f93c2;   /* steel blue: secondary accent / labels */
  --blue-3:#3c5776;   /* dim steel blue: tertiary labels */
  --blue-dim:#0f2438;
  --celebrate:#ffd25c;      /* reserved: closed deals / wins / milestones only */
  --celebrate-soft:#ffe6a3;
  --red:#ff5f6d;
  --glow:0 0 6px rgba(130,190,255,.85),0 0 18px rgba(90,160,255,.45),0 0 40px rgba(70,140,240,.2);
  --glow-soft:0 0 10px rgba(90,160,255,.35);
  --panel-bg:linear-gradient(160deg,rgba(18,32,52,.52),rgba(4,9,18,.38));
  --panel-border:rgba(140,180,230,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  background:var(--navy-0);
  overflow:hidden;
  font-family:'Share Tech Mono',monospace;
  color:var(--blue-1);
  -webkit-font-smoothing:antialiased;
}
h1,h2,.mono-head{font-family:'Orbitron',sans-serif}
::selection{background:rgba(90,160,255,.3)}

#scene{position:fixed;inset:0;z-index:0;display:block}

.vignette{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 46%, transparent 38%, rgba(0,2,6,.35) 72%, rgba(0,2,6,.92) 100%);
}
.scanlines{
  position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.35;mix-blend-mode:overlay;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 2px, transparent 4px);
}
.scan-sweep{
  position:fixed;left:0;right:0;height:26vh;z-index:7;pointer-events:none;
  top:-26vh;
  background:linear-gradient(to bottom, transparent, rgba(130,190,255,.05) 45%, rgba(130,190,255,.09) 50%, rgba(130,190,255,.05) 55%, transparent);
  animation:sweep 9s linear infinite;
  mix-blend-mode:screen;
}
@keyframes sweep{
  0%{top:-26vh}
  100%{top:100vh}
}
.noise-vig{
  position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 50% 50%, rgba(12,26,42,0) 0%, rgba(2,5,10,0) 55%, rgba(2,4,8,.55) 100%);
}

.hud{position:fixed;z-index:10}
.panel{
  background:var(--panel-bg);
  border:1px solid var(--panel-border);
  border-radius:3px;
  padding:14px 16px;
  backdrop-filter:blur(7px) saturate(140%);
  -webkit-backdrop-filter:blur(7px) saturate(140%);
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35), inset 0 0 22px rgba(90,150,255,.04);
}
.panel::before,.panel::after{
  content:"";position:absolute;width:10px;height:10px;pointer-events:none;
  border-color:var(--blue-2);opacity:.75;
}
.panel::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}

.panel-title{
  font-family:'Orbitron',sans-serif;
  font-size:10.5px;
  letter-spacing:3px;
  color:var(--blue-1);
  text-shadow:0 0 8px rgba(90,160,255,.6);
  margin-bottom:10px;
  padding-bottom:7px;
  border-bottom:1px solid rgba(140,180,230,.18);
  display:flex;align-items:center;gap:8px;
}
.panel-title::before{content:"";width:6px;height:6px;background:var(--blue-1);box-shadow:var(--glow);border-radius:1px;flex:none}

/* ---------- Top Left ---------- */
.hud-top-left{top:24px;left:24px;width:min(420px,38vw);padding:16px 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  font-size:20px;color:var(--blue-1);text-shadow:var(--glow);
  animation:corepulse 3.2s ease-in-out infinite;
}
@keyframes corepulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.brand h1{
  font-size:clamp(22px,2.6vw,32px);
  letter-spacing:6px;
  color:var(--blue-0);
  text-shadow:0 0 10px rgba(130,190,255,.85),0 0 30px rgba(90,160,255,.4);
  font-weight:800;
}
.subtitle{
  margin-top:8px;font-size:13px;letter-spacing:1px;color:var(--blue-2);opacity:.9;
}
.datestamp{
  margin-top:5px;font-size:10.5px;letter-spacing:1.5px;color:var(--blue-3);text-transform:uppercase;
}

/* ---------- Top Right ---------- */
.hud-top-right{top:24px;right:24px;width:min(300px,32vw);text-align:right}
.clock{
  font-family:'Orbitron',sans-serif;font-size:clamp(24px,2.6vw,32px);font-weight:700;
  letter-spacing:3px;color:var(--blue-0);text-shadow:var(--glow);
}
.clock-date{font-size:10.5px;letter-spacing:2px;color:var(--blue-3);text-transform:uppercase;margin-top:2px}
.connectors{list-style:none;margin-top:12px;padding-top:10px;border-top:1px solid rgba(140,180,230,.18)}
.conn{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  font-size:11.5px;letter-spacing:1px;color:var(--blue-2);padding:3px 0;text-transform:uppercase;
}
.conn .dot{width:7px;height:7px;border-radius:50%;flex:none}
.conn.online .dot{background:var(--blue-1);box-shadow:0 0 6px var(--blue-1),0 0 14px rgba(79,166,255,.7)}
.conn.offline .dot{background:var(--blue-3);box-shadow:0 0 5px var(--blue-3);animation:blink 1.1s steps(1) infinite}
.conn.offline{color:rgba(140,170,210,.65)}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}

/* ---------- Left column: log + priorities ---------- */
.hud-log{top:150px;left:24px;width:min(340px,30vw);max-height:34vh}
.log-list{list-style:none;display:flex;flex-direction:column;gap:7px;max-height:26vh;overflow:hidden}
.log-line{
  font-size:11px;line-height:1.4;display:flex;gap:8px;
  opacity:0;transform:translateX(-6px);transition:opacity .5s ease, transform .5s ease;
  border-left:2px solid rgba(140,180,230,.35);padding-left:8px;
}
.log-line.show{opacity:1;transform:translateX(0)}
.log-line.celebrate{border-left-color:rgba(255,210,92,.7)}
.log-time{color:var(--blue-3);flex:none}
.log-text{color:var(--blue-1);opacity:.92}
.log-line.celebrate .log-text{color:var(--celebrate);opacity:1;text-shadow:0 0 8px rgba(255,210,92,.4)}

.hud-priorities{top:calc(150px + 34vh + 16px);left:24px;width:min(340px,30vw)}
.priority-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.priority-item{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;line-height:1.35}
.priority-item .tag{
  flex:none;font-size:8.5px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:2px;
  border:1px solid rgba(140,180,230,.4);color:var(--blue-1);opacity:.85;white-space:nowrap;margin-top:1px;
}
.priority-item.urgency-high .tag{border-color:rgba(255,95,109,.55);color:#ff9aa3}
.priority-item .ptext{color:var(--blue-0);opacity:.9}
.priority-item::marker{content:""}
.priority-item .pdot{width:5px;height:5px;border-radius:50%;background:var(--red);margin-top:5px;box-shadow:0 0 6px var(--red);flex:none}

/* ---------- Right column: stats + sponsors ---------- */
.hud-stats{top:300px;right:24px;width:min(340px,30vw)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{}
.bar-label{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.5px;color:var(--blue-2);margin-bottom:4px;text-transform:uppercase}
.bar-value{color:var(--blue-0);font-weight:700}
.bar-track{height:5px;background:rgba(140,180,230,.08);border-radius:3px;overflow:hidden;position:relative}
.bar-fill{
  height:100%;border-radius:3px;width:100%;
  transform-origin:left center;transform:scaleX(0);
  background:linear-gradient(90deg,var(--blue-3),var(--blue-1));
  box-shadow:0 0 8px rgba(90,160,255,.7);
  transition:transform 1.4s cubic-bezier(.2,.8,.2,1);
}

.hud-sponsors{top:560px;right:24px;width:min(340px,30vw)}
.sponsor-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.sponsor-item{font-size:11px}
.sponsor-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sname{color:var(--blue-0);letter-spacing:.5px}
.sstatus{font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid}
.status-verbaldeal{color:var(--blue-2);border-color:rgba(111,147,194,.5)}
.status-pending{color:var(--blue-2);border-color:rgba(111,147,194,.5)}
.status-waiting{color:var(--blue-1);border-color:rgba(140,180,230,.4)}
.sstatus.celebrate{color:var(--celebrate);border-color:rgba(255,210,92,.6);box-shadow:0 0 10px rgba(255,210,92,.3);text-shadow:0 0 6px rgba(255,210,92,.4)}
.sdetail{color:var(--blue-3);font-size:10px;margin-top:2px;opacity:.85}

/* ---------- Bottom headline / metrics / payment chip ---------- */
.hud-headline{
  left:50%;bottom:118px;transform:translateX(-50%);
  width:min(980px,88vw);text-align:center;pointer-events:none;
}
.headline-text{
  font-family:'Orbitron',sans-serif;font-size:clamp(12px,1.5vw,16px);letter-spacing:3px;
  color:var(--blue-0);text-shadow:0 0 12px rgba(130,190,255,.55);margin-bottom:16px;
}
.metrics{display:flex;justify-content:center;gap:clamp(18px,4vw,52px);flex-wrap:wrap}
.metric-value{
  font-family:'Orbitron',sans-serif;font-size:clamp(22px,3vw,38px);font-weight:800;color:var(--blue-0);
  text-shadow:var(--glow);line-height:1;
}
.metric-value.celebrate{color:var(--celebrate);text-shadow:0 0 8px rgba(255,210,92,.85),0 0 24px rgba(255,210,92,.4)}
.metric-label{font-size:9.5px;letter-spacing:1.5px;color:var(--blue-3);text-transform:uppercase;margin-top:6px}
.metric-label.celebrate{color:var(--celebrate-soft);opacity:.85}

.payment-chip{
  pointer-events:auto;
  margin:18px auto 0;display:inline-flex;align-items:center;gap:10px;
  padding:7px 16px;border-radius:20px;
  border:1px solid rgba(140,180,230,.45);
  background:linear-gradient(160deg,rgba(18,32,52,.55),rgba(6,10,20,.4));
  box-shadow:0 0 16px rgba(90,160,255,.15), inset 0 0 10px rgba(90,160,255,.07);
  font-size:11px;letter-spacing:.5px;color:var(--blue-2);
}
.chip-dot{width:7px;height:7px;border-radius:50%;background:var(--blue-1);box-shadow:0 0 8px var(--blue-1);animation:blink 1.6s steps(1) infinite}
.chip-amount{color:var(--blue-0);font-weight:700}
.chip-date{color:var(--blue-3)}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:340px;transform:translateX(-50%) translateY(10px);
  z-index:20;pointer-events:none;
  background:linear-gradient(160deg,rgba(12,24,40,.85),rgba(4,9,18,.8));
  border:1px solid var(--blue-2);border-radius:4px;
  padding:12px 22px;max-width:min(640px,80vw);text-align:center;
  font-size:12.5px;letter-spacing:.5px;color:var(--blue-0);
  box-shadow:0 0 24px rgba(90,160,255,.25);
  opacity:0;transition:opacity .4s ease, transform .4s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Bottom bar ---------- */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;height:78px;z-index:11;
  display:flex;align-items:center;gap:22px;padding:0 26px;
  background:linear-gradient(to top, rgba(2,5,10,.92), rgba(2,5,10,.55));
  border-top:1px solid rgba(140,180,230,.25);
  box-shadow:0 -10px 30px rgba(0,0,0,.4);
}
.brief-btn{
  flex:none;position:relative;cursor:pointer;
  font-family:'Orbitron',sans-serif;font-size:12.5px;letter-spacing:2.5px;font-weight:700;
  color:var(--navy-0);background:linear-gradient(160deg,var(--blue-1),var(--blue-2));
  border:none;border-radius:24px;padding:13px 26px;
  box-shadow:0 0 18px rgba(90,160,255,.55), 0 0 40px rgba(90,160,255,.25);
  transition:transform .15s ease, box-shadow .3s ease, background .3s ease;
}
.brief-btn:hover{transform:translateY(-1px);box-shadow:0 0 24px rgba(90,160,255,.75), 0 0 54px rgba(90,160,255,.35)}
.brief-btn:active{transform:translateY(0)}
.brief-btn.speaking{
  background:linear-gradient(160deg,var(--blue-0),var(--blue-1));
  box-shadow:0 0 22px rgba(130,190,255,.75), 0 0 50px rgba(90,160,255,.4);
  animation:briefpulse 1.1s ease-in-out infinite;
}
@keyframes briefpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.btn-ring{
  position:absolute;inset:-6px;border-radius:30px;border:1px solid rgba(140,180,230,.35);
  opacity:0;pointer-events:none;
}
.brief-btn.speaking .btn-ring{opacity:1;animation:ringpulse 1.1s ease-out infinite}
@keyframes ringpulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.3);opacity:0}}

.ticker-wrap{flex:1;overflow:hidden;position:relative;height:20px;mask-image:linear-gradient(to right, transparent, black 6%, black 94%, transparent)}
.ticker{
  position:absolute;white-space:nowrap;display:flex;gap:0;
  font-size:11.5px;letter-spacing:1px;color:var(--blue-2);
  animation:tickerscroll 42s linear infinite;
}
.ticker span{padding-right:60px}
.ticker .celebrate-tick{color:var(--celebrate)}
@keyframes tickerscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.handle-btn{
  flex:none;cursor:pointer;background:transparent;
  border:1px solid rgba(140,180,230,.4);border-radius:20px;padding:12px 20px;
  font-family:'Orbitron',sans-serif;font-size:10.5px;letter-spacing:2px;color:var(--blue-1);
  text-shadow:0 0 8px rgba(90,160,255,.5);
  transition:background .2s ease, box-shadow .2s ease, transform .15s ease;
}
.handle-btn:hover{background:rgba(140,180,230,.08);box-shadow:0 0 16px rgba(90,160,255,.3);transform:translateY(-1px)}
.handle-btn:active{transform:translateY(0)}

/* ---------- Responsive ---------- */
@media (max-width:1150px){
  .hud-sponsors,.hud-priorities{display:none}
  .hud-log{max-height:44vh}
}
@media (max-width:760px){
  .hud-top-left{width:min(300px,60vw);padding:12px 16px}
  .hud-top-right{width:min(220px,44vw)}
  .hud-log{display:none}
  .hud-stats{top:150px}
  .brand h1{font-size:18px;letter-spacing:4px}
  .handle-btn{display:none}
  .hud-headline{bottom:100px}
}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="noise-vig"></div>
<div class="scan-sweep"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<header class="hud hud-top-left panel">
  <div class="brand"><span class="brand-mark">◉</span><h1>V.I.K.I.</h1></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="datestamp" id="datestamp"></div>
</header>

<div class="hud hud-top-right panel">
  <div class="clock" id="clock">00:00:00</div>
  <div class="clock-date" id="clockDate"></div>
  <ul class="connectors" id="connectors"></ul>
</div>

<div class="hud hud-log panel">
  <div class="panel-title">ACTIVITY STREAM</div>
  <ul class="log-list" id="logList"></ul>
</div>

<div class="hud hud-priorities panel">
  <div class="panel-title">PRIORITY QUEUE</div>
  <ul class="priority-list" id="priorityList"></ul>
</div>

<div class="hud hud-stats panel">
  <div class="panel-title">LEAD FUNNEL</div>
  <div class="bars" id="bars"></div>
</div>

<div class="hud hud-sponsors panel">
  <div class="panel-title">PARTNER STATUS</div>
  <ul class="sponsor-list" id="sponsorList"></ul>
</div>

<div class="hud hud-headline">
  <div class="headline-text" id="headlineText"></div>
  <div class="metrics" id="metrics"></div>
  <div class="payment-chip" id="paymentChip"></div>
</div>

<div class="toast" id="toast"></div>

<div class="bottom-bar">
  <button class="brief-btn" id="briefBtn"><span class="btn-ring"></span><span class="btn-label">BRIEF ME</span></button>
  <div class="ticker-wrap"><div class="ticker" id="ticker"></div></div>
  <button class="handle-btn" id="handleBtn">WHAT SHOULD I HANDLE FIRST</button>
</div>

<audio id="briefAudio" src="viki_brief.mp3" preload="auto" hidden></audio>

<script src="viki_data.js"></script>
<script>
(function(){
"use strict";
var DATA = window.VIKI_DATA || {};

function $(id){ return document.getElementById(id); }
function slug(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }

/* ================= HUD DATA BINDING ================= */

$('subtitle').textContent = DATA.greeting || "";
$('datestamp').textContent = (DATA.generatedLabel ? DATA.generatedLabel + " · " : "") + (DATA.generated || "");

function tickClock(){
  var now = new Date();
  $('clock').textContent = now.toLocaleTimeString('en-US',{hour12:false});
  $('clockDate').textContent = now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).toUpperCase();
}
tickClock();
setInterval(tickClock,1000);

$('connectors').innerHTML = (DATA.connectors||[]).map(function(c){
  return '<li class="conn '+(c.status==='online'?'online':'offline')+'"><span class="dot"></span>'+c.name+'</li>';
}).join('');

var funnel = (DATA.content && DATA.content.funnel) || [];
$('bars').innerHTML = funnel.map(function(f){
  return '<div class="bar-row"><div class="bar-label"><span>'+f.stage+'</span><span class="bar-value">'+f.value+'</span></div>'+
         '<div class="bar-track"><div class="bar-fill" data-pct="'+f.pct+'"></div></div></div>';
}).join('');
document.querySelectorAll('.bar-fill').forEach(function(el){
  el.style.width = Math.min(100, parseFloat(el.dataset.pct)) + '%';
});
requestAnimationFrame(function(){
  requestAnimationFrame(function(){
    document.querySelectorAll('.bar-fill').forEach(function(el){
      el.style.transform = 'scaleX(1)';
    });
  });
});

$('priorityList').innerHTML = (DATA.priorities||[]).map(function(p){
  return '<li class="priority-item urgency-'+slug(p.urgency)+'"><span class="pdot"></span><span class="tag">'+p.tag+'</span><span class="ptext">'+p.label+'</span></li>';
}).join('');

$('sponsorList').innerHTML = (DATA.sponsors||[]).map(function(s){
  return '<li class="sponsor-item"><div class="sponsor-top"><span class="sname">'+s.name+'</span>'+
         '<span class="sstatus status-'+slug(s.status)+(s.celebrate?' celebrate':'')+'">'+s.status+'</span></div>'+
         '<div class="sdetail">'+s.detail+'</div></li>';
}).join('');

$('headlineText').textContent = DATA.headline || "";
var metrics = (DATA.content && DATA.content.metrics) || [];
$('metrics').innerHTML = metrics.map(function(m){
  var cls = m.celebrate ? ' celebrate' : '';
  return '<div class="metric"><div class="metric-value'+cls+'">'+m.value+'</div><div class="metric-label'+cls+'">'+m.label+'</div></div>';
}).join('');

if(DATA.paymentDue){
  $('paymentChip').innerHTML =
    '<span class="chip-dot"></span><span class="chip-label">'+DATA.paymentDue.label+'</span>'+
    '<span class="chip-amount">'+DATA.paymentDue.amount+'</span>'+
    '<span class="chip-date">Due '+DATA.paymentDue.date+'</span>';
} else {
  $('paymentChip').style.display = 'none';
}

/* ticker: headline + partner status + priorities + closer, looped twice for seamless scroll */
var tickerParts = [];
if(DATA.headline) tickerParts.push(DATA.headline);
(DATA.sponsors||[]).forEach(function(s){
  var t = s.name.toUpperCase()+': '+s.status;
  tickerParts.push(s.celebrate ? '<span class="celebrate-tick">★ '+t+'</span>' : t);
});
(DATA.priorities||[]).forEach(function(p){ tickerParts.push(p.label); });
if(DATA.closer) tickerParts.push(DATA.closer);
var tickerText = tickerParts.join('   •   ');
$('ticker').innerHTML = '<span>'+tickerText+'</span><span aria-hidden="true">'+tickerText+'</span>';

/* activity log: reveal one line at a time, looping through content.log */
(function streamLog(){
  var lines = (DATA.content && DATA.content.log) || [];
  if(!lines.length) return;
  var list = $('logList');
  var i = 0;
  function pushLine(){
    var entry = lines[i % lines.length];
    var li = document.createElement('li');
    li.className = 'log-line' + (entry.celebrate ? ' celebrate' : '');
    var time = new Date().toLocaleTimeString('en-US',{hour12:false});
    li.innerHTML = '<span class="log-time">'+time+'</span><span class="log-text">'+(entry.celebrate?'★ ':'')+entry.text+'</span>';
    list.appendChild(li);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ li.classList.add('show'); }); });
    while(list.children.length > 7){ list.removeChild(list.firstChild); }
    i++;
    setTimeout(pushLine, 2400 + Math.random()*1600);
  }
  pushLine();
})();

/* ================= TOAST ================= */
var toastEl = $('toast');
var toastTimer = null;
function showToast(text, ms){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 6000);
}

$('handleBtn').addEventListener('click', function(){
  var top = (DATA.priorities||[])[0];
  if(top){ showToast('▲ HANDLE FIRST — '+top.label, 7000); }
});

/* ================= BRIEF ME + WEB AUDIO ANALYSIS ================= */
var briefBtn = $('briefBtn');
var audioEl = $('briefAudio');
var speaking = false;
var speakEndTimer = null;
var usedRealAudio = false;

/* -- Web Audio graph: analyses the actual playing audio in real time -- */
var audioCtx = null, analyser = null, freqData = null, audioGraphReady = false;
function ensureAudioGraph(){
  if(audioGraphReady) return true;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    audioCtx = new AC();
    var sourceNode = audioCtx.createMediaElementSource(audioEl);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.75;
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    audioGraphReady = true;
  }catch(e){
    audioGraphReady = false;
  }
  return audioGraphReady;
}

function setSpeaking(v){
  speaking = v;
  briefBtn.classList.toggle('speaking', v);
  briefBtn.querySelector('.btn-label').textContent = v ? 'SPEAKING' : 'BRIEF ME';
}

briefBtn.addEventListener('click', function(){
  if(speaking){
    try{ audioEl.pause(); audioEl.currentTime = 0; }catch(e){}
    clearTimeout(speakEndTimer);
    usedRealAudio = false;
    setSpeaking(false);
    return;
  }
  setSpeaking(true);
  showToast(DATA.closer || '', 6500);
  usedRealAudio = false;

  ensureAudioGraph();
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(function(){}); }
  try{ audioEl.currentTime = 0; }catch(e){}

  function fallback(){
    if(usedRealAudio) return;
    var duration = 9000 + Math.random()*3200;
    clearTimeout(speakEndTimer);
    speakEndTimer = setTimeout(function(){ setSpeaking(false); }, duration);
  }

  var p = audioEl.play();
  if(p && typeof p.then === 'function'){
    p.then(function(){ usedRealAudio = audioGraphReady; if(!usedRealAudio) fallback(); }).catch(fallback);
  } else {
    fallback();
  }
  audioEl.onended = function(){ setSpeaking(false); };
  audioEl.onerror = fallback;
  // if playback never actually starts producing audio, don't leave the head silent forever
  setTimeout(function(){ if(speaking && !usedRealAudio && audioEl.paused) fallback(); }, 600);
});

/* -- synthetic speech-envelope fallback (keeps BRIEF ME demonstrable offline) -- */
var synthAmpCur = 0, synthAmpTgt = 0, synthTimer = 0;
function stepSynthEnvelope(dtMs){
  synthTimer -= dtMs;
  if(synthTimer <= 0){
    var roll = Math.random();
    if(roll < 0.16) synthAmpTgt = 0.05 + Math.random()*0.15;
    else if(roll < 0.82) synthAmpTgt = 0.45 + Math.random()*0.4;
    else synthAmpTgt = 0.9 + Math.random()*0.1;
    synthTimer = 70 + Math.random()*110;
  }
  var rate = synthAmpTgt > synthAmpCur ? 0.4 : 0.16;
  synthAmpCur += (synthAmpTgt - synthAmpCur) * Math.min(1, rate * (dtMs/16.67));
}

/* returns {bass, treble, amp} each 0..1, from real analysis when available, else synthetic */
function getAudioBands(t, dtMs){
  if(!speaking) return {bass:0, treble:0, amp:0};
  if(usedRealAudio && analyser){
    analyser.getByteFrequencyData(freqData);
    var n = freqData.length;
    var bassEnd = Math.max(1, Math.floor(n*0.14));
    var trebleStart = Math.floor(n*0.42);
    var bassSum=0, trebleSum=0, totalSum=0, i;
    for(i=0;i<bassEnd;i++) bassSum += freqData[i];
    for(i=trebleStart;i<n;i++) trebleSum += freqData[i];
    for(i=0;i<n;i++) totalSum += freqData[i];
    return {
      bass: bassSum/bassEnd/255,
      treble: trebleSum/(n-trebleStart)/255,
      amp: totalSum/n/255
    };
  }
  stepSynthEnvelope(dtMs);
  var bass = (0.35 + 0.5*Math.abs(Math.sin(t*1.3))) * synthAmpCur;
  var treble = (0.3 + 0.6*Math.abs(Math.sin(t*4.7+0.6))*Math.abs(Math.sin(t*1.9))) * synthAmpCur;
  return { bass: bass, treble: treble, amp: synthAmpCur };
}

/* ================= CANVAS SCENE: V.I.K.I. VOXEL HEAD ================= */
var canvas = $('scene');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ---- rotation helpers ---- */
function rotY(p, a){
  var c = Math.cos(a), s = Math.sin(a);
  return { x: p.x*c + p.z*s, y: p.y, z: -p.x*s + p.z*c };
}
function rotX(p, a){
  var c = Math.cos(a), s = Math.sin(a);
  return { x: p.x, y: p.y*c - p.z*s, z: p.y*s + p.z*c };
}
function rotZ(p, a){
  var c = Math.cos(a), s = Math.sin(a);
  return { x: p.x*c - p.y*s, y: p.x*s + p.y*c, z: p.z };
}

/* ---- Fibonacci sphere point cloud: the glowing energy-core visual ---- */
var N = 680;
var points = (function(){
  var pts = [];
  var GA = Math.PI * (3 - Math.sqrt(5)); // golden angle
  for(var i=0;i<N;i++){
    var y = 1 - (i/(N-1))*2;
    var r = Math.sqrt(Math.max(0,1 - y*y));
    var theta = GA * i;
    pts.push({
      x: Math.cos(theta)*r,
      y: y,
      z: Math.sin(theta)*r,
      tw: Math.random()*Math.PI*2, // per-point twinkle phase
      ts: 0.6 + Math.random()*0.9  // twinkle speed
    });
  }
  return pts;
})();
var tiltX = 0.5;

/* ---- pointer parallax (subtle) ---- */
var mouseT = {x:0,y:0}, mouse = {x:0,y:0};
window.addEventListener('pointermove', function(e){
  mouseT.x = (e.clientX / W - 0.5);
  mouseT.y = (e.clientY / H - 0.5);
});

var idleT = 0;
var lastTime = performance.now();

/* ---- ring / arc / orbit framing angles ---- */
var spin = 0;
var orbitAngle = 0;
var arcAngles = [0, 0.6, 1.9];
var arcSpeeds = [0.00034, -0.00021, 0.00047];
var rayAngle = 0;

/* ---- spirit-figure particle trail (energy motes between sphere and figure) ---- */
var SPIRIT_PARTICLE_COUNT = 20;
var spiritParticles = (function(){
  var list = [];
  for(var i=0;i<SPIRIT_PARTICLE_COUNT;i++){
    list.push({ t: Math.random(), xJ: (Math.random()-0.5), speed: 0.25 + Math.random()*0.35, sway: Math.random()*Math.PI*2, size: 0.9 + Math.random()*1.3 });
  }
  return list;
})();

function draw(now){
  var dtMs = Math.min(48, now - lastTime);
  lastTime = now;
  idleT += dtMs/1000;

  var bands = getAudioBands(idleT, dtMs);
  // pulse: gentle idle breathing, harder + faster when speaking, driven by
  // the same Web Audio amplitude feed as the rest of the reactive UI.
  var breathe = Math.sin(idleT * 0.62) * 0.5 + 0.5;
  var pulse = speaking ? (1 + bands.amp*1.0) : (1 + breathe*0.11);
  var speakBoost = speaking ? bands.amp : 0;

  mouse.x += (mouseT.x - mouse.x) * 0.03;
  mouse.y += (mouseT.y - mouse.y) * 0.03;

  spin += dtMs * (0.00016 + (speaking ? speakBoost*0.00012 : 0));
  orbitAngle += dtMs * 0.00055;
  rayAngle += dtMs * 0.00009;
  for(var a=0;a<3;a++) arcAngles[a] += dtMs * arcSpeeds[a] * (1 + (speaking ? speakBoost*0.6 : 0));

  var cx = W/2, cy = H/2 + H*0.015;
  var R = Math.min(W,H) * 0.145;

  /* background */
  var bg = ctx.createRadialGradient(cx, cy - H*0.05, 0, cx, cy, Math.max(W,H)*0.75);
  bg.addColorStop(0, '#0a1728');
  bg.addColorStop(0.35, '#050d1a');
  bg.addColorStop(1, '#010305');
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  /* ambient glow */
  var glowR = R * (2.6 + pulse*0.5);
  var amb = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
  amb.addColorStop(0, 'rgba(120,175,255,'+(0.16 + speakBoost*0.12)+')');
  amb.addColorStop(0.4, 'rgba(80,140,230,0.07)');
  amb.addColorStop(1, 'rgba(10,20,30,0)');
  ctx.fillStyle = amb;
  ctx.beginPath(); ctx.arc(cx,cy,glowR,0,Math.PI*2); ctx.fill();

  /* outer tick ring */
  drawTickRing(cx, cy, R*2.5, spin*0.15);

  /* faint radial rays */
  drawRays(cx, cy, R*1.35, R*2.35, rayAngle);

  /* dashed HUD arcs */
  drawArc(cx, cy, R*1.62, arcAngles[0], [14,10], 0.28, 0.42);
  drawArc(cx, cy, R*1.86, arcAngles[1], [3,9], 0.9, 0.22);
  drawArc(cx, cy, R*2.08, arcAngles[2], [22,6], 0.55, 0.16);

  /* elliptical orbital ring + marker */
  drawOrbit(cx, cy, R*1.42, R*0.42, -0.42, orbitAngle);

  /* sphere point cloud */
  drawSphere(cx, cy, R, pulse, speakBoost);

  /* bright pulsing core */
  drawCore(cx, cy, R, pulse, speakBoost);

  /* hovering spirit figure above the sphere, and its energy-mote trail */
  var figH = R*1.3;
  var bobY = Math.sin(idleT*0.62) * (R*0.045 + speakBoost*R*0.02); // synced to the same breathing phase as the sphere
  var feetY = cy - R*0.55 + bobY;
  var headTopY = feetY - figH;

  drawSpiritParticles(cx, feetY, cy - R*0.05, dtMs, speakBoost);
  drawSpiritFigure(cx, feetY, figH, pulse, speakBoost);

  requestAnimationFrame(draw);
}

function drawTickRing(cx, cy, R, rot){
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot);
  var count = 90;
  for(var i=0;i<count;i++){
    var ang = (i/count)*Math.PI*2;
    var major = i % 5 === 0;
    var len = major ? 10 : 5;
    var x1 = Math.cos(ang)*R, y1 = Math.sin(ang)*R;
    var x2 = Math.cos(ang)*(R+len), y2 = Math.sin(ang)*(R+len);
    ctx.strokeStyle = 'rgba(140,190,255,'+(major?0.3:0.13)+')';
    ctx.lineWidth = major?1.3:1;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  ctx.restore();
}

function drawRays(cx, cy, r1, r2, rot){
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot);
  var count = 16;
  ctx.strokeStyle = 'rgba(110,170,255,0.06)';
  ctx.lineWidth = 1;
  for(var i=0;i<count;i++){
    var ang = (i/count)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang)*r1, Math.sin(ang)*r1);
    ctx.lineTo(Math.cos(ang)*r2, Math.sin(ang)*r2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawArc(cx, cy, R, rot, dash, sweep, alpha){
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.setLineDash(dash);
  ctx.strokeStyle = 'rgba(140,190,255,'+alpha+')';
  ctx.lineWidth = 1.4;
  ctx.shadowColor = 'rgba(110,170,255,0.55)';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(0,0,R, 0, Math.PI*2*sweep);
  ctx.stroke();
  ctx.restore();
}

function drawOrbit(cx, cy, rx, ry, rot, ang){
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.strokeStyle = 'rgba(130,190,255,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.stroke();

  var mx = Math.cos(ang)*rx, my = Math.sin(ang)*ry;
  var depth = Math.sin(ang); // -1 back .. 1 front
  var scale = 0.7 + (depth*0.5+0.5)*0.7;
  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createRadialGradient(mx,my,0,mx,my,10*scale);
  g.addColorStop(0,'rgba(230,242,255,0.95)');
  g.addColorStop(0.4,'rgba(130,190,255,0.55)');
  g.addColorStop(1,'rgba(130,190,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(mx,my,10*scale,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(235,245,255,0.95)';
  ctx.beginPath(); ctx.arc(mx,my,2.2*scale,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSphere(cx, cy, R, pulse, speakBoost){
  var focal = R*3.4;
  var mx = mouse.y * 0.35; // vertical mouse -> extra tilt
  var mz = mouse.x * 0.35;

  var proj = new Array(N);
  for(var i=0;i<N;i++){
    var p = points[i];
    var q = rotZ(p, mz*0.2);
    q = rotX(q, tiltX + mx);
    q = rotY(q, spin);
    proj[i] = q;
  }
  proj.sort(function(a,b){ return a.z - b.z; });

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(i=0;i<N;i++){
    var d = proj[i];
    var scale = focal / (focal - d.z*R);
    var sx = cx + d.x*R*scale;
    var sy = cy + d.y*R*scale*0.98;
    var depthA = (d.z + 1)/2; // 0 back .. 1 front
    var twinkle = 0.85 + 0.15*Math.sin(idleT*points[i].ts*2 + points[i].tw);
    var alpha = (0.12 + depthA*0.62) * twinkle * (0.85 + speakBoost*0.3);
    var size = (0.55 + depthA*1.15) * (pulse*0.9);
    ctx.beginPath();
    ctx.fillStyle = 'rgba(125,185,255,'+Math.min(1,alpha)+')';
    ctx.arc(sx, sy, size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawCore(cx, cy, R, pulse, speakBoost){
  var coreR = R*0.34*pulse;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  var halo = ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*3.2);
  halo.addColorStop(0, 'rgba(210,232,255,'+(0.5+speakBoost*0.3)+')');
  halo.addColorStop(0.25, 'rgba(130,190,255,0.28)');
  halo.addColorStop(1, 'rgba(130,190,255,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx,cy,coreR*3.2,0,Math.PI*2); ctx.fill();

  var core = ctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
  core.addColorStop(0,'rgba(255,255,255,0.98)');
  core.addColorStop(0.35,'rgba(205,232,255,0.9)');
  core.addColorStop(1,'rgba(120,180,255,0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

/* ---- energy motes drifting between the sphere and the hovering figure ---- */
function drawSpiritParticles(cx, zoneTop, zoneBottom, dtMs, speakBoost){
  var span = zoneBottom - zoneTop;
  if(span <= 0) return;
  var activity = 0.35 + speakBoost*1.4; // calmer at idle, livelier while speaking

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var i=0;i<spiritParticles.length;i++){
    var p = spiritParticles[i];
    p.t += (dtMs/1000) * p.speed * (0.5 + activity*0.5);
    if(p.t > 1){
      p.t = 0;
      p.xJ = (Math.random()-0.5);
      p.sway = Math.random()*Math.PI*2;
      p.speed = 0.25 + Math.random()*0.35;
      p.size = 0.9 + Math.random()*1.3;
    }
    var y = zoneTop + p.t*span;
    var x = cx + p.xJ*14 + Math.sin(idleT*0.8 + p.sway)*5;
    // fade in near the figure, fade out (dissipate) as it nears the sphere
    var fade = Math.sin(Math.min(1,p.t)*Math.PI);
    var alpha = fade * (0.22 + activity*0.26) * p.size;
    var size = p.size * (1 + speakBoost*0.6);

    ctx.beginPath();
    ctx.fillStyle = 'rgba(150,205,255,'+Math.min(0.55,alpha)+')';
    ctx.arc(x, y, size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

/* ---- simple translucent glowing humanoid silhouette hovering above the sphere ---- */
function drawSpiritFigure(cx, feetY, FH, pulse, speakBoost){
  var glowAlpha = 0.5 + speakBoost*0.5;
  var bodyAlpha = 0.22 + speakBoost*0.22;
  var headPulse = 1 + (pulse-1)*0.6 + speakBoost*0.15;

  var headR   = FH*0.078;
  var headY   = feetY - FH*0.925;
  var shoulderY = feetY - FH*0.80;
  var hipY    = feetY - FH*0.44;
  var shoulderW = FH*0.155;
  var hipW    = FH*0.075;
  var handY   = feetY - FH*0.50;
  var handW   = FH*0.20;
  var footW   = FH*0.09;

  function limb(x1,y1,x2,y2,w,alpha,blur){
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(150,205,255,'+alpha+')';
    ctx.lineWidth = w;
    ctx.shadowColor = 'rgba(120,185,255,0.9)';
    ctx.shadowBlur = blur;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // soft outer aura, wider + fainter, behind everything
  limb(cx, shoulderY, cx, hipY, shoulderW*2.1, bodyAlpha*0.35, 22);
  limb(cx-shoulderW*0.6, shoulderY, cx-handW*0.6, handY, FH*0.11, bodyAlpha*0.3, 16);
  limb(cx+shoulderW*0.6, shoulderY, cx+handW*0.6, handY, FH*0.11, bodyAlpha*0.3, 16);
  limb(cx-hipW*0.7, hipY, cx-footW*0.8, feetY, FH*0.13, bodyAlpha*0.3, 16);
  limb(cx+hipW*0.7, hipY, cx+footW*0.8, feetY, FH*0.13, bodyAlpha*0.3, 16);

  // defined translucent body — torso, arms (relaxed, slightly bowed at the sides), legs
  limb(cx, shoulderY, cx, hipY, shoulderW*1.15, bodyAlpha, 12);          // torso
  limb(cx-shoulderW*0.6, shoulderY, cx-handW*0.6, handY, FH*0.05, bodyAlpha, 9);  // left arm
  limb(cx+shoulderW*0.6, shoulderY, cx+handW*0.6, handY, FH*0.05, bodyAlpha, 9);  // right arm
  limb(cx-hipW*0.7, hipY, cx-footW*0.8, feetY, FH*0.06, bodyAlpha, 9);   // left leg
  limb(cx+hipW*0.7, hipY, cx+footW*0.8, feetY, FH*0.06, bodyAlpha, 9);   // right leg

  // neck
  limb(cx, headY+headR*0.8, cx, shoulderY, FH*0.035, bodyAlpha, 8);

  // head: the brightest point on the figure, like a small second core
  var hr = headR*headPulse;
  var hHalo = ctx.createRadialGradient(cx,headY,0,cx,headY,hr*3.4);
  hHalo.addColorStop(0, 'rgba(220,238,255,'+glowAlpha+')');
  hHalo.addColorStop(0.35, 'rgba(140,200,255,'+(glowAlpha*0.32)+')');
  hHalo.addColorStop(1, 'rgba(140,200,255,0)');
  ctx.fillStyle = hHalo;
  ctx.beginPath(); ctx.arc(cx,headY,hr*3.4,0,Math.PI*2); ctx.fill();

  var hCore = ctx.createRadialGradient(cx,headY,0,cx,headY,hr);
  hCore.addColorStop(0, 'rgba(255,255,255,'+Math.min(1,0.8+speakBoost*0.3)+')');
  hCore.addColorStop(0.55, 'rgba(200,228,255,0.55)');
  hCore.addColorStop(1, 'rgba(150,205,255,0)');
  ctx.fillStyle = hCore;
  ctx.beginPath(); ctx.arc(cx,headY,hr,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

requestAnimationFrame(draw);

})();
</script>
