<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F0;font-family:'DM Sans',sans-serif;color:#1a1a2e;-webkit-font-smoothing:antialiased}
.header{background:#fff;border-bottom:1px solid #EBEBEB;padding:18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 1px 12px rgba(0,0,0,0.05)}
.header-left .sub{font-size:10px;letter-spacing:4px;color:#bbb;text-transform:uppercase;margin-bottom:4px}
.header-left .title{font-size:28px;font-family:'Playfair Display',serif;font-weight:800;color:#111}
.header-right{background:#F5F5F0;border-radius:10px;padding:10px 14px;text-align:right}
.header-right .sync-label{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:1px}
.header-right .sync-date{font-size:13px;color:#888;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:16px 16px 0}
.stat{border:1px solid #EBEBEB;border-radius:12px;padding:12px 6px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.stat-num{font-size:28px;font-family:'Playfair Display',serif;font-weight:700}
.stat-label{font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:1.5px;margin-top:3px}
.projects{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 0}
.proj-tile{border-radius:14px;padding:16px 14px;position:relative;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;border:1.5px solid #EBEBEB;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.proj-tile:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.proj-tile .accent-bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;display:none}
.proj-tile.active .accent-bar{display:block}
.proj-header{display:flex;justify-content:space-between;margin-bottom:9px}
.proj-emoji{font-size:24px}
.proj-name{font-size:13px;font-weight:600;color:#999;margin-bottom:4px}
.proj-count{font-size:11px;color:#bbb;margin-bottom:10px}
.prog-track{background:#F0F0EC;border-radius:99px;height:5px}
.prog-fill{height:100%;border-radius:99px;transition:width .5s ease}
.section-label{padding:20px 16px 0;display:flex;align-items:center;gap:10px}
.section-title{font-size:18px;font-family:'Playfair Display',serif;font-weight:700;color:#111}
.section-badge{font-size:12px;border-radius:99px;padding:3px 12px;border:1px solid}
.tabs{display:flex;gap:7px;padding:12px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{border-radius:99px;padding:7px 15px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1.5px solid #EBEBEB;background:#fff;color:#999;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all .15s}
.tab.active{font-weight:600}
.tab-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.tab-count{opacity:.4;font-size:11px}
.tasks{padding:12px 16px 60px;display:flex;flex-direction:column;gap:10px}
.task-card{background:#fff;border:1px solid #EBEBEB;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.04);border-left:4px solid #ddd;transition:transform .12s}
.task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.task-name{font-size:15px;line-height:1.6;color:#1a1a2e;font-weight:500;flex:1}
.task-name.done{color:#bbb;text-decoration:line-through}
.task-badge{border-radius:99px;padding:4px 11px;display:flex;align-items:center;gap:4px;flex-shrink:0}
.task-badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.task-badge-text{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.task-notes{font-size:13px;color:#999;line-height:1.6;margin-top:9px}
.task-priority{display:inline-block;border-radius:99px;padding:3px 11px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:9px}
.empty{text-align:center;color:#ccc;font-size:14px;padding:48px 0}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .3s ease forwards}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="sub">Multipreneur OS</div>
    <div class="title">Command Center</div>
  </div>
  <div class="header-right">
    <div class="sync-label">Last sync</div>
    <div class="sync-date">May 8 · 2026</div>
  </div>
</div>
<div class="stats" id="stats"></div>
<div class="projects" id="projects"></div>
<div class="section-label" id="section-label"></div>
<div class="tabs" id="tabs"></div>
<div class="tasks" id="tasks"></div>
<script>
const TASKS=[{task:"Schedule training days — Florida Fire",project:"Soccer",status:"In Progress",priority:"High",notes:"Verbal deal reached. NFDA = Official Technical Training Partner"},{task:"Formalize written contract — Florida Fire",project:"Soccer",status:"To Do",priority:"High",notes:"10% referral fee agreed verbally"},{task:"Research + outreach to future club prospects",project:"Soccer",status:"To Do",priority:"Medium",notes:""},{task:"Secure field space — identify + negotiate terms",project:"Soccer",status:"To Do",priority:"High",notes:""},{task:"Schedule meeting — Vice Mayor Colburn (Miramar Grant)",project:"Soccer",status:"Waiting",priority:"Medium",notes:"Waiting on them to confirm"},{task:"Follow up — Pines Charter West Campus (Sean Chance)",project:"Soccer",status:"Waiting",priority:"High",notes:"Email sent, confirmed receipt"},{task:"Follow up — Somerset Academy",project:"Soccer",status:"Waiting",priority:"Medium",notes:"Email sent"},{task:"Reach out — Camp Embark / Lydia",project:"Soccer",status:"To Do",priority:"Medium",notes:""},{task:"Check in — Tony March (bereavement)",project:"Soccer",status:"Waiting",priority:"Low",notes:"Wait until appropriate time"},{task:"Research local summer camps + initiate outreach",project:"Soccer",status:"To Do",priority:"Medium",notes:""},{task:"Visit Miramar Sunset Lakes Park in person (D1)",project:"Soccer",status:"To Do",priority:"Medium",notes:"Need to identify contact on site"},{task:"Find Miramar banner contact (D2)",project:"Soccer",status:"To Do",priority:"Low",notes:""},{task:"Finalize Lauderhill Summer schedule + pitch",project:"Soccer",status:"To Do",priority:"Medium",notes:"Team has June off. Exploring May Wed/Fri sessions"},{task:"Check Broward County vendor registration status",project:"Soccer",status:"Waiting",priority:"High",notes:"Last checked Mon 4/13"},{task:"Follow up with Tania — Pembroke Pines PaymentWorks",project:"Soccer",status:"Waiting",priority:"High",notes:"Awaiting PaymentWorks invite"}];
const PROJECTS={Soccer:{emoji:"⚽",color:"#059669",light:"#ECFDF5",border:"#A7F3D0",text:"#065F46"},"Real Estate":{emoji:"🏠",color:"#D97706",light:"#FFFBEB",border:"#FDE68A",text:"#92400E"},"Passive Income":{emoji:"💡",color:"#7C3AED",light:"#F5F3FF",border:"#DDD6FE",text:"#4C1D95"},Career:{emoji:"💼",color:"#2563EB",light:"#EFF6FF",border:"#BFDBFE",text:"#1E3A8A"},"Home Family":{emoji:"🏡",color:"#DB2777",light:"#FDF2F8",border:"#FBCFE8",text:"#831843"}};
const STATUS_ORDER=["To Do","In Progress","Waiting","Done"];
const STATUS_META={"To Do":{dot:"#EF4444",bg:"#FEF2F2",text:"#B91C1C"},"In Progress":{dot:"#F59E0B",bg:"#FFFBEB",text:"#B45309"},Waiting:{dot:"#9CA3AF",bg:"#F9FAFB",text:"#6B7280"},Done:{dot:"#10B981",bg:"#ECFDF5",text:"#065F46"}};
const PC={High:"#DC2626",Medium:"#D97706",Low:"#9CA3AF"},PB={High:"#FEF2F2",Medium:"#FFFBEB",Low:"#F9FAFB"};
let AP="Soccer",AS=null;
const tot=n=>TASKS.filter(t=>t.project===n).length,don=n=>TASKS.filter(t=>t.project===n&&t.status==="Done").length,pct=n=>{const x=tot(n);return x?Math.round((don(n)/x)*100):0};
function renderStats(){const ip=TASKS.filter(t=>t.status==="In Progress").length,wt=TASKS.filter(t=>t.status==="Waiting").length,ur=TASKS.filter(t=>t.priority==="High"&&t.status!=="Done").length;document.getElementById("stats").innerHTML=[{l:"Total",v:TASKS.length,c:"#111",b:"#fff"},{l:"Active",v:ip,c:"#D97706",b:"#FFFBEB"},{l:"Waiting",v:wt,c:"#6B7280",b:"#F9FAFB"},{l:"Urgent",v:ur,c:"#DC2626",b:"#FEF2F2"}].map(s=>`<div class="stat" style="background:${s.b}"><div class="stat-num" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join("");}
function renderProjects(){document.getElementById("projects").innerHTML=Object.entries(PROJECTS).map(([n,p])=>{const ia=n===AP,pc=pct(n);return`<div class="proj-tile${ia?" active":""}" onclick="selP('${n}')" style="${ia?`background:${p.light};border-color:${p.border};box-shadow:0 4px 20px ${p.color}20`:""}"><div class="accent-bar" style="background:${p.color}"></div><div class="proj-header"><span class="proj-emoji">${p.emoji}</span><span style="font-size:11px;font-weight:600;color:${ia?p.color:"#ccc"}">${pc}%</span></div><div class="proj-name" style="color:${ia?p.text:"#999"}">${n}</div><div class="proj-count">${don(n)}/${tot(n)} done</div><div class="prog-track"><div class="prog-fill" style="width:${pc}%;background:${p.color}"></div></div></div>`;}).join("");}
function renderLabel(){const p=PROJECTS[AP],c=TASKS.filter(t=>t.project===AP).length;document.getElementById("section-label").innerHTML=`<span style="font-size:20px">${p.emoji}</span><span class="section-title">${AP}</span><span class="section-badge" style="background:${p.light};color:${p.text};border-color:${p.border}">${c} tasks</span>`;}
function renderTabs(){const p=PROJECTS[AP],pt=TASKS.filter(t=>t.project===AP);document.getElementById("tabs").innerHTML=[null,...STATUS_ORDER].map(s=>{const ia=AS===s,m=s?STATUS_META[s]:null,c=s?pt.filter(t=>t.status===s).length:pt.length;return`<button class="tab${ia?" active":""}" onclick="selS(${s?`'${s}'`:"null"})" style="${ia?`background:${p.light};border-color:${p.border};color:${p.text}`:""}"><span>${m?`<span class="tab-dot" style="background:${m.dot}"></span>`:""}</span>${s||"All"} <span class="tab-count">${c}</span></button>`;}).join("");}
function renderTasks(){const pt=TASKS.filter(t=>t.project===AP),ft=AS?pt.filter(t=>t.status===AS):pt,el=document.getElementById("tasks");el.style.animation="none";void el.offsetWidth;el.style.animation="";el.className="tasks fade-up";if(!ft.length){el.innerHTML='<div class="empty">No tasks here yet</div>';return;}el.innerHTML=ft.map(t=>{const sm=STATUS_META[t.status]||STATUS_META["To Do"],id=t.status==="Done";return`<div class="task-card" style="border-left-color:${PC[t.priority]||"#ddd"}"><div class="task-top"><div class="task-name${id?" done":""}">${t.task}</div><div class="task-badge" style="background:${sm.bg}"><div class="task-badge-dot" style="background:${sm.dot}"></div><span class="task-badge-text" style="color:${sm.text}">${t.status}</span></div></div>${t.notes?`<div class="task-notes">${t.notes}</div>`:""}${t.priority?`<span class="task-priority" style="background:${PB[t.priority]};color:${PC[t.priority]}">${t.priority}</span>`:""}</div>`;}).join("");}
function selP(n){AP=n;AS=null;renderProjects();renderLabel();renderTabs();renderTasks()}
function selS(s){AS=s==="null"?null:s;renderTabs();renderTasks()}
renderStats();renderProjects();renderLabel();renderTabs();renderTasks();
</script>
</body>
</html>
